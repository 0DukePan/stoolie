[package]
name = "stoolie"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
description = "The receipts Windows throws away: what used your microphone, camera and location, and when"
license = "AGPL-3.0-or-later"
repository = "https://github.com/0DukePan/stoolie"
readme = "README.md"
keywords = ["privacy", "windows", "microphone", "camera", "cli"]
categories = ["command-line-utilities"]

[lib]
name = "stoolie"
path = "src/lib.rs"

[[bin]]
name = "stoolie"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
